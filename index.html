<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4eee2">
  <meta name="description" content="保一考古：替代役民防役專業訓練考古題，支援反復練習、模擬測驗、錯題本與進度統計。">
  <title>保一考古｜替代役民防役刷題</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page-grain" aria-hidden="true"></div>

  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="保一考古首頁">
        <span class="brand-seal">保<br>一</span>
        <span class="brand-text">
          <span class="brand-kicker">替代役民防役</span>
          <span class="brand-name">考古</span>
        </span>
      </a>
      <p class="brand-note">五份試卷 · 八十道題<br>把考古題刷成反射動作。</p>

      <nav class="side-nav" aria-label="主要導覽">
        <a class="nav-item" href="#home" data-nav="home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
          <span>首頁</span>
        </a>
        <a class="nav-item" href="#wrong" data-nav="wrong">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v5h4M9 13h6M9 17h4"/></svg>
          <span>錯題本</span>
          <span class="nav-count" id="nav-wrong-count">0</span>
        </a>
        <a class="nav-item" href="#saved" data-nav="saved">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"/></svg>
          <span>收藏</span>
        </a>
        <a class="nav-item" href="#stats" data-nav="stats">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          <span>統計</span>
        </a>
      </nav>

      <div class="side-section">
        <div class="side-heading">試卷</div>
        <div id="side-papers" class="side-papers"></div>
      </div>

      <div class="side-foot">
        <span class="offline-dot"></span>
        <span>離線可用 · 進度存在本機</span>
        <span class="side-version">v1.2.2</span>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <div class="topbar-left">
          <span class="topbar-eyebrow">保一考古</span>
          <span class="topbar-divider"></span>
          <span class="topbar-title" id="topbar-title">首頁</span>
        </div>
        <div class="topbar-right">
          <span class="streak-pill" id="streak-pill" title="連續練習天數">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c1 4-3 5-3 9a3 3 0 0 0 6 0c0-1-.3-2-1-3 3 1 4 3.5 4 6a6 6 0 0 1-12 0c0-5 4-7 6-12z"/></svg>
            <span id="streak-text">0 天</span>
          </span>
          <span class="today-pill" id="today-pill">今日 0 題</span>
        </div>
      </header>

      <main id="app" class="app" tabindex="-1"></main>

      <footer class="site-footer">
        <span>題目轉錄自 113 年替代役民防役訓練測驗卷</span>
        <span class="dot">·</span>
        <span>「參考答案」題目請搭配現行法規複習</span>
      </footer>
    </div>
  </div>

  <nav class="mobile-nav" aria-label="行動版導覽">
    <a href="#home" data-nav="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
      <span>首頁</span>
    </a>
    <a href="#wrong" data-nav="wrong">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v5h4M9 13h6M9 17h4"/></svg>
      <span>錯題</span>
    </a>
    <a href="#saved" data-nav="saved">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"/></svg>
      <span>收藏</span>
    </a>
    <a href="#stats" data-nav="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>統計</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script src="js/questions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
